# matchmaking runs as exactly one copy: the engine's state (skill index,
# fairness heap, cooldown queue) is one process's memory, and two copies would
# put two engines on the same queue, each seeing half of it. Recreate stops the
# old pod before starting the new, so an update never runs two engines at once.
# The short gap it leaves is a state recovery already covers: intake reads
# matchmaking DOWN, holds queued players, and requeues them on the new pod's
# MatchmakingStarted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaking
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matchmaking
    spec:
      containers:
        - name: matchmaking
          # Placeholder tag; scripts/minikube-up.sh sets the real short-SHA tag.
          image: match3d-matchmaking:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: match3d-config
                  key: MATCHMAKING_DATASOURCE_URL
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: match3d-config
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: match3d-secret
                  key: SPRING_DATASOURCE_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaking
spec:
  # LoadBalancer, not NodePort: on the Docker driver a NodePort is not
  # reachable from the host, so `minikube tunnel` assigns a stable external IP.
  type: LoadBalancer
  selector:
    app: matchmaking
  ports:
    - port: 8081
      targetPort: 8081
