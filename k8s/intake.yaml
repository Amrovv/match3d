# intake runs as three copies: it keeps no state in memory, so any copy serves
# any request, and killing one leaves the rest carrying the load. A rolling
# update replaces them one at a time, so capacity never drops to zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
spec:
  replicas: 3
  selector:
    matchLabels:
      app: intake
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: intake
    spec:
      # One copy per node, so a node dying never takes more than one at once.
      # With three pods and three nodes this places exactly one on each.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: intake
      containers:
        - name: intake
          # The tag is a placeholder. scripts/minikube-up.sh sets the real
          # short-SHA tag after apply, which also triggers the rollout.
          image: match3d-intake:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: match3d-config
                  key: INTAKE_DATASOURCE_URL
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: match3d-config
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: match3d-secret
                  key: SPRING_DATASOURCE_PASSWORD
          # Startup covers a slow boot (Flyway, the broker connection) so
          # liveness never kills a pod that is still starting.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          # Liveness is the process alone: a database or broker outage must not
          # restart every pod in a loop.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          # Readiness adds the database and broker, so a pod that cannot do its
          # job stops getting traffic and returns on its own when they recover.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: intake
spec:
  type: NodePort
  selector:
    app: intake
  ports:
    - port: 8080
      targetPort: 8080
