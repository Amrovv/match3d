server.port=8080
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.datasource.url=jdbc:postgresql://localhost:5432/intake
spring.datasource.username=postgres
# No password here. It is supplied by SPRING_DATASOURCE_PASSWORD: a Secret in
# Kubernetes, an environment variable under Compose and for a local run.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# On shutdown, finish in-flight requests before exiting, so a maintenance stop
# loses no work. State survives an abrupt kill too, since it all lives in Postgres.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Liveness is the process alone, so an outage elsewhere never restarts pods.
# Readiness adds the database and broker, so a pod that cannot work gets no traffic.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
