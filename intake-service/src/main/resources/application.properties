server.port=8080
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.datasource.url=jdbc:postgresql://localhost:5432/intake
spring.datasource.username=postgres
spring.datasource.password=match3d
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Liveness is the process alone, so an outage elsewhere never restarts pods.
# Readiness adds the database and broker, so a pod that cannot work gets no traffic.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
