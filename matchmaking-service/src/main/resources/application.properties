server.port=8081
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.datasource.url=jdbc:postgresql://localhost:5432/matchmaking
spring.datasource.username=postgres
spring.datasource.password=match3d
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# The local seed is a repeatable migration outside the default folder, so a run without it is expected.
spring.flyway.ignore-migration-patterns=repeatable:missing
