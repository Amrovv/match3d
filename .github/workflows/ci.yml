name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Every module reports, so one failure cannot hide another.
      fail-fast: false
      matrix:
        module: [common, matchmaking-core, intake-service, matchmaking-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :${{ matrix.module }}:build

  images:
    name: image (${{ matrix.image }})
    # Only a merge to main publishes, and only once every module is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - module: intake-service
            image: match3d-intake
          - module: matchmaking-service
            image: match3d-matchmaking
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; the owner is Amrovv.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SHA says exactly which commit an image is; latest is for people.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
            ${{ steps.name.outputs.ref }}:latest
