name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Every module reports, so one failure cannot hide another.
      fail-fast: false
      matrix:
        module: [common, matchmaking-core, intake-service, matchmaking-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :${{ matrix.module }}:build
